<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon">U</div>
                <span>AdminPanel</span>
            </div>
            <ul class="sidebar-menu">
                <li><a href="index.html">📊 Dashboard</a></li>
                <li><a href="create.html" class="active">➕ Add User</a></li>
            </ul>
        </aside>

        <main class="main-wrapper">
            <header class="top-bar">
                <div class="top-bar-title"><h1>Add New User</h1></div>
            </header>

            <div class="content-body">
                <div class="form-card">
                    <div id="alertContainer"></div>

                    <form id="createForm" novalidate>
                        <div class="form-group">
                            <label for="name">Full Name</label>
                            <input type="text" id="name" name="name" placeholder="e.g. Jane Doe" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" placeholder="e.g. jane@example.com" required>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Save User</button>
                            <a href="index.html" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initCreateUser();
        });
    </script>
</body>
</html>
